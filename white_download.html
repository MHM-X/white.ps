<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحميل تطبيق White</title>

  <!-- خط رسمي احترافي -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Almarai', 'Poppins', sans-serif;
      background: #141d95;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }

    /* تأثير الخلفية */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    /* رأس الصفحة */
    .header {
      margin-bottom: 50px;
      animation: slideDown 0.8s ease-out;
    }

    .logo {
      margin-bottom: 25px;
    }

    .logo img {
      width: 120px;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.2));
    }

    .app-description {
      color: rgba(255, 255, 255, 0.95);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
      font-family: 'Almarai', sans-serif;
    }

    /* قسم التحميل */
    .download-section {
      margin-top: 50px;
      animation: slideUp 0.8s ease-out 0.2s both;
    }

    .section-title {
      color: white;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 35px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      font-family: 'Almarai', sans-serif;
    }

    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 45px;
    }

    .download-link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 24px;
      background: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      font-family: 'Almarai', 'Poppins', sans-serif;
    }

    .download-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: #f0f0f0;
      transition: left 0.3s ease;
      z-index: -1;
    }

    .download-link:hover {
      transform: translateY(-8px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
    }

    .download-link:hover::before {
      left: 0;
    }

    .download-link:active {
      transform: translateY(-4px);
    }

    .store-logo {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .store-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .button-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: right;
    }

    .button-label {
      font-size: 12px;
      color: #666;
      font-weight: 400;
      font-family: 'Poppins', sans-serif;
    }

    .button-text {
      font-size: 16px;
      color: #141d95;
      font-weight: 600;
      font-family: 'Almarai', sans-serif;
    }

    .download-link:hover .button-text {
      color: #141d95;
    }

    /* قسم المميزات */
    .features-section {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: right;
    }

    .features-title {
      color: #141d95;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-family: 'Almarai', sans-serif;
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      justify-content: flex-end;
      color: #333;
      font-size: 13px;
      line-height: 1.5;
      font-family: 'Almarai', sans-serif;
    }

    .feature-icon {
      color: #141d95;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* الحركات */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* الهواتف الذكية */
    @media (max-width: 600px) {
      body {
        padding: 30px 16px;
      }

      .container {
        max-width: 100%;
      }

      .header {
        margin-bottom: 40px;
      }

      .logo img {
        width: 90px;
      }

      .app-description {
        font-size: 14px;
      }

      .section-title {
        font-size: 18px;
        margin-bottom: 28px;
      }

      .buttons-grid {
        gap: 14px;
        margin-bottom: 35px;
      }

      .download-link {
        padding: 14px 20px;
        gap: 14px;
        border-radius: 12px;
      }

      .store-logo {
        width: 28px;
        height: 28px;
      }

      .button-label {
        font-size: 11px;
      }

      .button-text {
        font-size: 15px;
      }

      .features-section {
        padding: 22px;
        border-radius: 14px;
      }

      .features-title {
        font-size: 15px;
        margin-bottom: 14px;
      }

      .feature-item {
        font-size: 12px;
        gap: 10px;
      }

      .feature-icon {
        font-size: 13px;
      }
    }

    @media (max-width: 400px) {
      .app-title {
        font-size: 28px;
      }

      .button-content {
        align-items: center;
        text-align: center;
      }

      .feature-item {
        justify-content: center;
      }

      .features-title {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- رأس الصفحة -->
    <header class="header">
      <div class="logo">
        <img src="logo.svg" alt="Logo White App" />
      </div>
      <p class="app-description">
      </p>
    </header>

    <!-- قسم التحميل -->
    <div class="download-section">
      <h2 class="section-title">حمّل التطبيق الآن</h2>

      <div class="buttons-grid">
        <!-- زر Google Play -->
        <a href="https://play.google.com/store/apps/details?id=com.whiteapp.laundry" class="download-link" target="_blank" rel="noopener noreferrer">
          <div class="store-logo">
            <img src="logos_google-play-icon.svg" alt="Google Play" />
          </div>
          <div class="button-content">
            <span class="button-label">متاح على</span>
            <span class="button-text">Google Play</span>
          </div>
        </a>

        <!-- زر App Store -->
        <a href="https://apps.apple.com/ae/app/white/id6758341372" class="download-link" target="_blank" rel="noopener noreferrer">
          <div class="store-logo">
            <img src="apple_store.svg" alt="App Store" />
          </div>
          <div class="button-content">
            <span class="button-label">متاح على</span>
            <span class="button-text">App Store</span>
          </div>
        </a>
      </div>

</body>

</html>
